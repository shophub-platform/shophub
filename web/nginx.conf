# nginx konfiguracija za serviranje ShopHub Angular SPA (FZ 4, 9.4).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip za statiku
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Keširanje hash-ovanih asset-a
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proksiranje API poziva ka ShopHub backend-u.
    # Promeni host/port prema svom deployment-u (npr. servis u Kubernetes-u).
    location /api/ {
        proxy_pass http://shophub-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — sve ostalo ide na index.html (Angular router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
